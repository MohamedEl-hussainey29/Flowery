apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: flowery
spec:
  replicas: 1
  selector:
    matchLabels:
      component: frontend
  template:
    metadata:
      labels:
        component: frontend
    spec:
      containers:
        - name: frontend
          image: mowalid29/flowery-frontend
          ports:
            - name: http
              containerPort: 80